plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withReader('UTF-8') { localProps.load(it) }
}

// Ключ подписи release-сборки: НЕ в репозитории. На vps3 лежит в /opt/tsd-build/keys
// (keystore.properties: storeFile, storePassword, keyAlias, keyPassword), путь к нему —
// в переменной TSD_KEYSTORE_PROPS (так делает deploy_apk_vps3.sh). Без переменной
// release не подписывается — собирайте debug.
def ksProps = new Properties()
def ksPath = System.getenv("TSD_KEYSTORE_PROPS")
if (ksPath && file(ksPath).exists()) {
    file(ksPath).withReader('UTF-8') { ksProps.load(it) }
}

android {
    namespace 'com.otgruzka.tsd'
    compileSdk 36

    defaultConfig {
        applicationId "com.otgruzka.tsd"
        minSdk 26
        targetSdk 36
        // Бампать при КАЖДОМ релизе — иначе баннер обновления не сработает
        // (version.json генерится из этих значений скриптом deploy_apk.sh)
        versionCode 19
        versionName "2.17"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (ksProps['storeFile']) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksProps['storeFile']) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "otgruzka-tsd.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
